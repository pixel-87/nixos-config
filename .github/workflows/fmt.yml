name: Check Formatting

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
    paths:
      - "**.nix"
      - ".github/workflows/fmt.yml"
  push:
    paths:
      - "**.nix"
      - ".github/workflows/fmt.yml"

permissions:
  contents: read

jobs:
  check-format:
    name: Check Nix Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref && inputs.ref || github.ref_name }}
          persist-credentials: false

      - name: Install nix with cachix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Check Formatting
        run: nix fmt -- --fail-on-change .

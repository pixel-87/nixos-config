name: Bump Flake Inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "3 0 * * *"

permissions: {}
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-url }}
      branch: ${{ steps.pr.outputs.pull-request-branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nix with cachix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Update Lockfile
        id: pr
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29.0.0
        with:
          token: ${{ secrets.GH_ACTION_TOKEN }}
          commit-msg: "flake.lock: update all inputs"
          pr-title: "flake.lock: update all inputs"
          branch: update-flake-inputs
          pr-body: |
            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

  check-lock:
    name: Check Lock
    needs: update-lockfile
    uses: $/.github/workflows/check-lock.yaml
    with:
      ref: ${{ needs.update-lockfile.outputs.branch }}

  ci:
    name: CI
    needs: update-lockfile
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/ci.yaml
    with:
      ref: ${{ needs.update-lockfile.outputs.branch }}


  merge:
    name: Merge Pull Request
    needs: [update-lockfile, ci, check-lock]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Merge Pull Request
        run: gh pr merge --rebase --auto --delete-branch "$PR"
        env:
          GH_TOKEN: ${{ secrets.GH_ACTION_TOKEN }}
          PR: ${{ needs.update-lockfile.outputs.pr }}

apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:stable
          envFrom:
            - configMapRef:
                name: minecraft-server
          volumeMounts:
            - name: minecraft-storage
              mountPath: /data
      volumes:
        - name: minecraft-storage
          persistentVolumeClaim:
            claimName: minecraft-data

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-server
  namespace: minecraft
data:
  EULA: "TRUE"
  TYPE: "PAPER"
  GAMEMODE: "survival"
  DIFFICULTY: "normal"
  ALLOW_CHEATS: "true"
  PLAYER_IDLE_TIMEOUT: "30"
  WHITE_LIST: "true"
  VIEW_DISTANCE: "10"
  TICK_DISTANCE: "6"
  MAX_THREADS: "2"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minecraft-lithium
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /srv/minecraft
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lithium
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  storageClassName: ""
  volumeName: minecraft-lithium
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: minecraft
  ports:
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: 25565
      nodePort: 30565

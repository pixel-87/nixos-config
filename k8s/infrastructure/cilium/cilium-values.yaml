k8sServiceHost: "192.168.0.45"
k8sServicePort: "6443"

kubeProxyReplacement: false

ipam:
  mode: kubernetes

routingMode: tunnel
tunnelProtocol: vxlan

cni:
  binPath: /var/lib/cni/bin
  confPath: /var/lib/cni/net.d

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

operator:
  replicas: 1
  tolerations:
    - operator: Exists
